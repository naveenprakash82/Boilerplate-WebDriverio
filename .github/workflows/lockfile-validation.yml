name: Lockfile reproducibility check

on:
  push:
    branches:
      - feature/npm-lockfile-validation

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Run browser tests
        run: npm test
        env:
          CI: 'true'
      - name: Preserve resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock-node22
          path: package-lock.json
          if-no-files-found: error
  commit-lockfile:
    needs: verify-lockfile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Retrieve verified lockfile
        uses: actions/download-artifact@v4
        with:
          name: npm-package-lock-node22
      - name: Commit lockfile to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add npm dependency lockfile"
            git push origin HEAD:feature/npm-lockfile-validation
          fi
