name: Browser tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit resolved lockfile on integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/junit-manifest-review'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock integrated reporter dependency graph'
            git push origin HEAD:refs/heads/integration/junit-manifest-review
          fi
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify reliability analysis
        run: npm run test:unit
      - name: Verify synthetic JUnit manifest example
        run: npm run analyze:manifest -- examples/junit-report-manifest.json
      - name: Run browser tests
        run: npm test
        env:
          CI: 'true'
      - name: Audit dependency advisories
        run: npm audit --audit-level=high
