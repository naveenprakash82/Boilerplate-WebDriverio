name: Browser tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit resolved lockfile on experiment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/wdio10-dependency-audit'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock WebdriverIO 10 dependency graph'
            git push origin HEAD:refs/heads/experiment/wdio10-dependency-audit
          fi
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify reliability analysis
        run: npm run test:unit
      - name: Run browser tests
        run: npm test
        env:
          CI: 'true'
      - name: Audit dependency advisories
        run: npm audit --audit-level=high
